<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đọc Hóa Đơn AI</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #212529; height: 100vh; display: flex; flex-direction: column; }
        .container { padding: 16px; overflow-y: auto; flex: 1; }
        .card { background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); margin-bottom: 16px; }
        h2 { font-size: 16px; margin-bottom: 12px; color: #1a252f; font-weight: 700; }
        
        /* VÙNG CHỌN FILE */
        .dropzone { border: 2px dashed #0d6efd; border-radius: 6px; padding: 20px; text-align: center; background: #f0f7ff; color: #0d6efd; font-weight: 600; transition: all 0.2s; cursor: pointer; }
        .dropzone:hover { background: #e1f0ff; border-color: #0b5ed7; }
        .dropzone.dragover { background-color: #d0e4ff !important; border-color: #0b5ed7 !important; transform: scale(1.02); }

        #fileName { color: #0b5ed7; font-size: 15px; font-weight: 700; display: block; margin-bottom: 10px; }
        .paste-hint { display: block; font-size: 13px; color: #6c757d; margin-bottom: 10px; font-weight: normal; }
        
        .btn-select-file { background-color: #0d6efd; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; display: inline-block; }
        .btn-select-file:hover { background-color: #0b5ed7; }

        /* Input file ẩn */
        #fileInput { display: none; }

        .btn { background-color: #0d6efd; color: #fff; border: none; padding: 11px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; width: 100%; margin-top: 10px; }
        .btn:disabled { background-color: #6c757d; cursor: not-allowed; }
        .btn-clear { background-color: #dc3545; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 8px; display: none; }
        
        /* Nút kiểm tra trùng mới */
        .btn-check-dup { background-color: #ffc107; color: #000; font-weight: 700; margin-top: 15px; }
        .btn-check-dup:hover { background-color: #ffca2c; }

        .status { margin-top: 10px; font-size: 13px; font-weight: 600; color: #dc3545; word-break: break-word; }
        
        .preview-table-container { overflow-x: auto; border-radius: 6px; border: 1px solid #b0b8c1; margin-top: 12px; }
        .preview-table { width: 100%; border-collapse: collapse; font-size: 13px; background-color: #fff; color: #111; }
        .preview-table th, .preview-table td { border: 1px solid #cbd5e1; padding: 10px 8px; text-align: left; vertical-align: middle; }
        .preview-table th { background-color: #343a40; color: #fff; font-weight: 700; font-size: 13px; text-transform: uppercase; }
        .preview-table td { color: #000; font-weight: 500; background-color: #fff; }
        .preview-table tbody tr:nth-child(even) td { background-color: #f8fafc; }
        .preview-table tbody tr:hover td { background-color: #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Tải lên Hóa đơn (Chọn nhiều Ảnh hoặc PDF)</h2>
        
        <!-- VÙNG KÉO THẢ VÀ CHỌN FILE -->
        <div class="dropzone" id="dropZone">
            <span id="fileName">Chưa có tệp nào được chọn</span>
            <span class="paste-hint">💡 Hoặc kéo thả file vào đây / bấm Ctrl+V để dán ảnh.</span>
            
            <button class="btn-select-file" onclick="document.getElementById('fileInput').click()">📂 Chọn Tệp Từ Máy Tính</button>
            <input type="file" id="fileInput" accept="image/*,application/pdf" multiple onchange="handleFileSelect(event)">
        </div>

        <button id="clearBtn" class="btn-clear" onclick="clearSelectedFiles(event)">🗑️ Xóa danh sách file đã chọn</button>
        <button id="processBtn" class="btn" disabled onclick="processAllInvoices()">Đọc Tất Cả Hóa Đơn & Xuất Bảng Tính</button>
        
        <div id="status" class="status"></div>

        <!-- NÚT KIỂM TRA TRÙNG LẶP -->
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #dee2e6;">
        <h2>Kiểm Tra Dữ Liệu</h2>
        <button class="btn btn-check-dup" onclick="checkDuplicates()">🔍 Kiểm Tra Hóa Đơn Trùng Lặp</button>
        <div id="checkStatus" class="status" style="color: #0d6efd;"></div>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <h2>Danh Sách Hóa Đơn Đã Trích Xuất</h2>
        <div class="preview-table-container">
            <table class="preview-table">
                <thead>
                    <tr>
                        <th style="width: 50px; text-align: center;">STT</th>
                        <th>Số HĐ</th>
                        <th>Ngày HĐ</th>
                        <th>Đơn vị bán</th>
                        <th>Mã số thuế</th>
                        <th>Trước VAT</th>
                        <th>Thuế VAT</th>
                        <th>Sau VAT</th>
                    </tr>
                </thead>
                <tbody id="previewBody"></tbody>
            </table>
        </div>
        <button class="btn" style="background-color: #198754;" onclick="insertAllToSheet()">Chèn Tất Cả Vào Bảng Tính</button>
    </div>
</div>

<script>
    const GEMINI_MODEL = "gemini-3.8-flash"; 
    let selectedFiles = [];
    let extractedResults = [];

    Office.onReady(function(info) {
        if (info.host === Office.HostType.Excel) {
            setupDragAndDrop();
        }
    });

    function handleFileSelect(event) {
        const files = Array.from(event.target.files);
        if (files.length === 0) return;
        addFiles(files);
        updateStatus(`✓ Đã chọn ${files.length} tệp.`, "#198754");
        event.target.value = '';
    }

    function setupDragAndDrop() {
        const dropZone = document.getElementById('dropZone');
        window.addEventListener("dragover", function(e) { e.preventDefault(); }, false);
        window.addEventListener("drop", function(e) { e.preventDefault(); }, false);

        dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', function(e) { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files);
            const validFiles = files.filter(f => f.type.startsWith('image/') || f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
            if (validFiles.length > 0) {
                addFiles(validFiles);
                updateStatus(`✓ Đã thêm ${validFiles.length} tệp qua kéo thả.`, "#198754");
            } else {
                updateStatus("Vui lòng chỉ kéo thả file Ảnh hoặc PDF!", "#dc3545");
            }
        });
    }

    document.addEventListener('paste', function (event) {
        const items = (event.clipboardData || event.originalEvent.clipboardData).items;
        let newPastedFiles = [];
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf("image") !== -1) {
                const blob = items[i].getAsFile();
                if (blob) {
                    const fileName = `screenshot_${Date.now()}_${newPastedFiles.length + 1}.png`;
                    newPastedFiles.push(new File([blob], fileName, { type: blob.type }));
                }
            }
        }
        if (newPastedFiles.length > 0) {
            addFiles(newPastedFiles);
            updateStatus(`✓ Đã dán ${newPastedFiles.length} ảnh từ Clipboard.`, "#198754");
        }
    });

    function addFiles(files) {
        selectedFiles = selectedFiles.concat(files);
        document.getElementById('fileName').innerText = `📁 Đã chọn tổng cộng ${selectedFiles.length} tệp hóa đơn`;
        document.getElementById('processBtn').disabled = false;
        document.getElementById('clearBtn').style.display = 'inline-block';
    }

    function updateStatus(text, color) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = text;
        statusDiv.style.color = color;
    }

    function clearSelectedFiles(event) {
        if (event) event.stopPropagation();
        selectedFiles = [];
        document.getElementById('fileName').innerText = 'Chưa có tệp nào được chọn';
        document.getElementById('processBtn').disabled = true;
        document.getElementById('clearBtn').style.display = 'none';
        updateStatus('Đã xóa danh sách file.', '#6c757d');
    }

    function parsePureNumber(val) {
        if (val === null || val === undefined || val === "") return "";
        var str = String(val).trim().replace(/[^0-9.,\-]/g, '');
        if (!str) return "";
        var lastDot = str.lastIndexOf('.');
        var lastComma = str.lastIndexOf(',');
        if (lastDot !== -1 && lastComma !== -1) {
            if (lastDot > lastComma) { str = str.replace(/,/g, ''); }
            else { str = str.replace(/\./g, '').replace(',', '.'); }
        } else if (lastComma !== -1) {
            var parts = str.split(',');
            if (parts.length > 2) { str = str.replace(/,/g, ''); }
            else { if (parts[1].length === 3) { str = str.replace(/,/g, ''); } else { str = str.replace(',', '.'); } }
        } else if (lastDot !== -1) {
            var parts = str.split('.');
            if (parts.length > 2) { str = str.replace(/\./g, ''); }
            else { if (parts[1].length === 3) { str = str.replace(/\./g, ''); } }
        }
        var num = parseFloat(str);
        return isNaN(num) ? str : num;
    }

    async function fetchWithRetry(url, options, maxRetries = 3, initialDelay = 1500) {
        let delay = initialDelay;
        for (let attempt = 1; attempt <= maxRetries; attempt++) {
            try {
                const response = await fetch(url, options);
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                return data;
            } catch (error) {
                if (attempt === maxRetries) throw error;
                updateStatus(`⏳ Máy chủ bận, đang thử lại (${attempt}/${maxRetries})...`, "#fd7e14");
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2;
            }
        }
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    async function processAllInvoices() {
        const processBtn = document.getElementById('processBtn');
        processBtn.disabled = true;
        extractedResults = [];
        let errorMessages = [];

        const promptText = `Trích xuất thông tin hóa đơn này và trả về JSON duy nhất:
{
  "soHoaDon": "string",
  "ngayXuat": "string (định dạng dd/mm/yyyy)",
  "donViBan": "string",
  "maSoThue": "string",
  "soTienTruocVAT": "string (số thuần túy không có phân cách hàng ngàn, ví dụ: 867300)",
  "thueVAT": "string (số thuần túy không có phân cách hàng ngàn, ví dụ: 73964)",
  "tongSoTien": "string (số thuần túy không có phân cách hàng ngàn, ví dụ: 941264)"
}`;

        const apiUrl = `https://gemini-invoice-proxy.trieudong-5277.workers.dev/`;

        for (let i = 0; i < selectedFiles.length; i++) {
            const file = selectedFiles[i];
            updateStatus(`⏳ Đang đọc file (${i + 1}/${selectedFiles.length}): ${file.name}...`, "#0d6efd");
            try {
                const base64Data = await fileToBase64(file);
                let mimeType = file.type;
                if (!mimeType && file.name.toLowerCase().endsWith('.pdf')) mimeType = 'application/pdf';
                const requestBody = {
                    "contents": [{
                        "parts": [
                            { "text": promptText },
                            { "inline_data": { "mime_type": mimeType || "image/png", "data": base64Data } }
                        ]
                    }]
                };
                const data = await fetchWithRetry(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let textResponse = data.candidates[0].content.parts[0].text;
                    const jsonMatch = textResponse.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        const jsonRes = JSON.parse(jsonMatch[0]);
                        jsonRes.soTienTruocVAT = parsePureNumber(jsonRes.soTienTruocVAT);
                        jsonRes.thueVAT = parsePureNumber(jsonRes.thueVAT);
                        jsonRes.tongSoTien = parsePureNumber(jsonRes.tongSoTien);
                        extractedResults.push(jsonRes);
                    } else { throw new Error("Không tìm thấy cấu trúc JSON."); }
                } else { throw new Error("Không nhận được nội dung từ AI."); }
            } catch (err) {
                errorMessages.push(`${file.name}: ${err.message}`);
            }
        }

        if (extractedResults.length > 0) {
            showPreviewList(extractedResults);
            updateStatus(`✓ Hoàn tất! Đã đọc thành công ${extractedResults.length}/${selectedFiles.length} hóa đơn.`, "#198754");
        } else {
            updateStatus("Lỗi: " + (errorMessages.join(" | ") || "Không xác định"), "#dc3545");
        }
        processBtn.disabled = false;
    }

    function showPreviewList(list) {
        const tbody = document.getElementById('previewBody');
        tbody.innerHTML = list.map((data, index) => `
            <tr>
                <td style="text-align: center; font-weight: bold;">${index + 1}</td>
                <td>${data.soHoaDon || ''}</td>
                <td>${data.ngayXuat || ''}</td>
                <td>${data.donViBan || ''}</td>
                <td>${data.maSoThue || ''}</td>
                <td>${data.soTienTruocVAT ?? ''}</td>
                <td>${data.thueVAT ?? ''}</td>
                <td>${data.tongSoTien ?? ''}</td>
            </tr>
        `).join('');
        document.getElementById('resultCard').style.display = 'block';
    }

    // ====== CHÈN EXCEL ======
    async function insertAllToSheet() {
        if (!extractedResults || extractedResults.length === 0) return;
        try {
            await Excel.run(async (context) => {
                const sheet = context.workbook.worksheets.getActiveWorksheet();
                const tables = sheet.tables;
                tables.load("items/name");
                await context.sync();

                if (tables.items.length === 0) throw new Error("Không tìm thấy Table.");
                const table = tables.items[0];
                const dataBodyRange = table.getDataBodyRange();
                dataBodyRange.load("values");
                await context.sync();

                let maxStt = 0;
                if (dataBodyRange.values && dataBodyRange.values.length > 0) {
                    dataBodyRange.values.forEach(row => {
                        const val = parseInt(row[0], 10);
                        if (!isNaN(val) && val > maxStt) maxStt = val;
                    });
                }

                table.load("rows/count");
                await context.sync();
                let insertIndex = table.rows.count - 1; 
                if (insertIndex < 1) insertIndex = 1;

                for (let i = 0; i < extractedResults.length; i++) {
                    const d = extractedResults[i];
                    const stt = maxStt + 1 + i;

                    let dateStr = String(d.ngayXuat || "").trim();
                    if (dateStr) {
                        let parts = dateStr.split('/');
                        if (parts.length === 3) {
                            parts[0] = parts[0].padStart(2, '0');
                            parts[1] = parts[1].padStart(2, '0');
                            dateStr = parts.join('/');
                        }
                    }

                    const rowData = [
                        String(stt), "", "", "",
                        String(d.soHoaDon || ""),
                        dateStr, 
                        String(d.donViBan || ""),
                        String(d.maSoThue || ""),
                        "",
                        String(d.soTienTruocVAT ?? ""),
                        String(d.thueVAT ?? ""),
                        String(d.tongSoTien ?? ""),
                        ""
                    ];

                    const newRow = table.rows.add(insertIndex + i, [rowData]);
                    
                    if (dateStr !== "") {
                        const dateCell = newRow.getRange().getCell(0, 5);
                        dateCell.numberFormat = [["@"]];
                    }
                    await context.sync(); 
                }
            });
            updateStatus(`✓ Đã chèn ${extractedResults.length} hóa đơn vào bảng tính!`, "#198754");
        } catch (error) {
            updateStatus("Lỗi khi chèn vào Excel: " + error.message, "#dc3545");
        }
    }

    // ====== KIỂM TRA TRÙNG LẶP (MỚI) ======
    async function checkDuplicates() {
        const checkStatusDiv = document.getElementById('checkStatus');
        checkStatusDiv.innerText = "⏳ Đang quét dữ liệu tìm hóa đơn trùng...";
        checkStatusDiv.style.color = "#0d6efd";

        try {
            await Excel.run(async (context) => {
                const sheet = context.workbook.worksheets.getActiveWorksheet();
                const tables = sheet.tables;
                tables.load("items/name");
                await context.sync();

                if (tables.items.length === 0) throw new Error("Không tìm thấy Table.");
                const table = tables.items[0];
                const dataBodyRange = table.getDataBodyRange();
                dataBodyRange.load("values");
                await context.sync();

                const values = dataBodyRange.values;
                if (!values || values.length === 0) {
                    checkStatusDiv.innerText = "Bảng chưa có dữ liệu để kiểm tra.";
                    checkStatusDiv.style.color = "#6c757d";
                    return;
                }

                // Xóa toàn bộ màu highlight cũ trước khi kiểm tra
                dataBodyRange.format.fill.clear();

                // Tạo mảng chứa khóa trùng lặp
                let keyMap = {};
                let duplicateKeys = new Set();

                // Quét dữ liệu (Cột E là Số HĐ index 4, Cột F là Ngày HĐ index 5, Cột H là MST index 7)
                for (let i = 0; i < values.length; i++) {
                    const row = values[i];
                    // Bỏ qua các dòng rỗng (không có số hóa đơn)
                    if (!row[4]) continue;

                    const invNo = String(row[4]).trim().toLowerCase();
                    const invDate = String(row[5]).trim(); // Định dạng dd/mm/yyyy
                    const taxId = String(row[7]).trim().toLowerCase();

                    const key = `${invNo}|${invDate}|${taxId}`;

                    if (keyMap[key] !== undefined) {
                        // Nếu khóa đã tồn tại => Phát hiện trùng
                        duplicateKeys.add(key);
                    } else {
                        keyMap[key] = i;
                    }
                }

                if (duplicateKeys.size === 0) {
                    checkStatusDiv.innerText = "✅ Tuyệt vời! Không tìm thấy hóa đơn nào bị trùng lặp.";
                    checkStatusDiv.style.color = "#198754";
                    return;
                }

                // Tiến hành tô màu các dòng bị trùng
                const highlightColor = "#ffcccc"; // Màu đỏ nhạt
                let dupCount = 0;

                for (let i = 0; i < values.length; i++) {
                    const row = values[i];
                    if (!row[4]) continue;

                    const invNo = String(row[4]).trim().toLowerCase();
                    const invDate = String(row[5]).trim();
                    const taxId = String(row[7]).trim().toLowerCase();
                    const key = `${invNo}|${invDate}|${taxId}`;

                    if (duplicateKeys.has(key)) {
                        const rowRange = dataBodyRange.getRow(i);
                        rowRange.format.fill.color = highlightColor;
                        dupCount++;
                    }
                }

                checkStatusDiv.innerText = `⚠️ Phát hiện ${duplicateKeys.size} cụm hóa đơn bị trùng lặp (tổng cộng ${dupCount} dòng đã được tô màu đỏ).`;
                checkStatusDiv.style.color = "#dc3545";
            });
        } catch (error) {
            checkStatusDiv.innerText = "Lỗi khi kiểm tra: " + error.message;
            checkStatusDiv.style.color = "#dc3545";
        }
    }
</script>
</body>
</html>
