<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đọc Hóa Đơn AI</title>
    <!-- Office.js bắt buộc -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: #f8f9fa; color: #212529; height: 100vh; display: flex; flex-direction: column; }
        .container { padding: 16px; overflow-y: auto; flex: 1; }
        .card { background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); margin-bottom: 16px; }
        h2 { font-size: 16px; margin-bottom: 12px; color: #1a252f; font-weight: 700; }
        
        /* CSS cho khu vực chọn file */
        .file-input-wrapper { border: 2px dashed #0d6efd; border-radius: 6px; padding: 20px; text-align: center; background: #f0f7ff; color: #0d6efd; font-weight: 600; }
        #fileName { color: #0b5ed7; font-size: 14px; font-weight: 600; display: block; margin-bottom: 10px; }
        .paste-hint { display: block; font-size: 11px; color: #6c757d; margin-bottom: 15px; font-weight: normal; }

        .btn-select-file {
            background-color: #0d6efd; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; display: inline-block;
        }
        .btn-select-file:hover { background-color: #0b5ed7; }

        .btn { background-color: #0d6efd; color: #fff; border: none; padding: 11px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; width: 100%; margin-top: 10px; }
        .btn:disabled { background-color: #6c757d; cursor: not-allowed; }
        .btn-clear { background-color: #dc3545; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 8px; display: none; }
        .status { margin-top: 10px; font-size: 13px; font-weight: 600; color: #dc3545; word-break: break-word; }
        
        .preview-table-container { overflow-x: auto; border-radius: 6px; border: 1px solid #b0b8c1; margin-top: 12px; }
        .preview-table { width: 100%; border-collapse: collapse; font-size: 13px; background-color: #fff; color: #111; }
        .preview-table th, .preview-table td { border: 1px solid #cbd5e1; padding: 10px 8px; text-align: left; vertical-align: middle; }
        .preview-table th { background-color: #343a40; color: #fff; font-weight: 700; font-size: 13px; text-transform: uppercase; }
        .preview-table td { color: #000; font-weight: 500; background-color: #fff; }
        .preview-table tbody tr:nth-child(even) td { background-color: #f8fafc; }
        .preview-table tbody tr:hover td { background-color: #e2e8f0; }
        
        /* Hiệu ứng khi kéo thả file */
        .dragover { background-color: #d0e4ff !important; border-color: #0b5ed7 !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Tải lên Hóa đơn (Chọn nhiều Ảnh hoặc PDF)</h2>
        
        <!-- Vùng kéo thả và nút chọn file -->
        <div class="file-input-wrapper" id="dropZone">
            <span id="fileName">Chưa có tệp nào được chọn</span>
            <span class="paste-hint">💡 Hoặc kéo thả tệp từ máy tính vào khung này. Có thể bấm Ctrl + V để dán ảnh.</span>
            
            <input type="file" id="fileInput" accept="image/*,application/pdf" multiple style="display: none;" onchange="handleFileSelect(event)">
            
            <!-- THAY ĐỔI Ở ĐÂY: Dùng một function riêng thay vì gọi trực tiếp document.getElementById -->
            <button class="btn-select-file" onclick="triggerFileInput()">📂 Chọn Tệp Từ Máy Tính</button>
        </div>

        <button id="clearBtn" class="btn-clear" onclick="clearSelectedFiles(event)">🗑️ Xóa danh sách file đã chọn</button>
        <button id="processBtn" class="btn" disabled onclick="processAllInvoices()">Đọc Tất Cả Hóa Đơn & Xuất Bảng Tính</button>
        <div id="status" class="status"></div>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <h2>Danh Sách Hóa Đơn Đã Trích Xuất</h2>
        <div class="preview-table-container">
            <table class="preview-table">
                <thead>
                    <tr>
                        <th style="width: 50px; text-align: center;">STT</th>
                        <th>Số HĐ</th>
                        <th>Ngày HĐ</th>
                        <th>Đơn vị bán</th>
                        <th>Mã số thuế</th>
                        <th>Trước VAT</th>
                        <th>Thuế VAT</th>
                        <th>Sau VAT</th>
                    </tr>
                </thead>
                <tbody id="previewBody"></tbody>
            </table>
        </div>
        <button class="btn" style="background-color: #198754;" onclick="insertAllToSheet()">Chèn Tất Cả Vào Bảng Tính</button>
    </div>
</div>

<script>
    // ====== CẤU HÌNH ======
    const GEMINI_MODEL = "gemini-3.8-flash"; 

    let selectedFiles = [];
    let extractedResults = [];

    // Office.js khởi tạo
    Office.onReady(function(info) {
        if (info.host === Office.HostType.Excel) {
            console.log("Excel add-in đã sẵn sàng");
            setupDragAndDrop(); // Kích hoạt tính năng kéo thả
        }
    });

    // ====== HÀM MỚI ĐỂ KÍCH HOẠT INPUT FILE ======
    function triggerFileInput() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput) {
            fileInput.click();
        } else {
            console.error("Không tìm thấy thẻ input file.");
        }
    }

    // ====== HÀM XỬ LÝ KHI NGƯỜI DÙNG CHỌN FILE TỪ MÁY TÍNH ======
    function handleFileSelect(event) {
        const files = Array.from(event.target.files);
        // Lọc ra các file hợp lệ (ảnh hoặc pdf)
        const validFiles = files.filter(f => f.type.startsWith('image/') || f.type === 'application/pdf');
        
        if (validFiles.length > 0) {
            // Nối file mới vào danh sách file đã chọn
            selectedFiles = selectedFiles.concat(validFiles);
            
            // Cập nhật giao diện
            updateFileStatusText(`📁 Đã nhận tổng cộng ${selectedFiles.length} tệp hóa đơn`);
            document.getElementById('processBtn').disabled = false;
            document.getElementById('clearBtn').style.display = 'inline-block';
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = `✓ Đã thêm ${validFiles.length} tệp từ máy tính.`;
            statusDiv.style.color = "#198754";
        }
        
        // Reset giá trị input để có thể chọn lại chính file đó nếu cần (sau khi đã bấm xóa)
        event.target.value = '';
    }

    // ====== TÍNH NĂNG KÉO THẢ FILE VÀO KHUNG (DRAG & DROP) ======
    function setupDragAndDrop() {
        const dropZone = document.getElementById('dropZone');

        // Ngăn trình duyệt mở file khi kéo nhầm ra ngoài
        window.addEventListener("dragover", function(e) { e.preventDefault(); }, false);
        window.addEventListener("drop", function(e) { e.preventDefault(); }, false);

        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            const files = Array.from(e.dataTransfer.files);
            const validFiles = files.filter(f => f.type.startsWith('image/') || f.type === 'application/pdf');
            
            if (validFiles.length > 0) {
                selectedFiles = selectedFiles.concat(validFiles);
                updateFileStatusText(`📁 Đã nhận tổng cộng ${selectedFiles.length} tệp hóa đơn`);
                document.getElementById('processBtn').disabled = false;
                document.getElementById('clearBtn').style.display = 'inline-block';
                const statusDiv = document.getElementById('status');
                statusDiv.innerText = `✓ Đã thêm ${validFiles.length} tệp qua kéo thả.`;
                statusDiv.style.color = "#198754";
            }
        });
    }

    // ====== CÁC HÀM XỬ LÝ FILE ======
    document.addEventListener('paste', function (event) {
        const items = (event.clipboardData || event.originalEvent.clipboardData).items;
        let newPastedFiles = [];
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf("image") !== -1) {
                const blob = items[i].getAsFile();
                if (blob) {
                    const fileName = `screenshot_${Date.now()}_${selectedFiles.length + newPastedFiles.length + 1}.png`;
                    newPastedFiles.push(new File([blob], fileName, { type: blob.type }));
                }
            }
        }
        if (newPastedFiles.length > 0) {
            selectedFiles = selectedFiles.concat(newPastedFiles);
            updateFileStatusText(`📋 Đã nhận tổng cộng ${selectedFiles.length} ảnh/tệp hóa đơn`);
            document.getElementById('processBtn').disabled = false;
            document.getElementById('clearBtn').style.display = 'inline-block';
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = `✓ Đã dán thêm ${newPastedFiles.length} ảnh (Tổng: ${selectedFiles.length} tệp).`;
            statusDiv.style.color = "#198754";
        }
    });

    function updateFileStatusText(text) {
        document.getElementById('fileName').innerText = text;
    }

    function clearSelectedFiles(event) {
        if (event) event.stopPropagation();
        selectedFiles = [];
        document.getElementById('fileName').innerText = 'Chưa có tệp nào được chọn';
        document.getElementById('processBtn').disabled = true;
        document.getElementById('clearBtn').style.display = 'none';
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = 'Đã xóa danh sách file.';
        statusDiv.style.color = '#6c757d';
    }

    function parsePureNumber(val) {
        if (val === null || val === undefined || val === "") return "";
        var str = String(val).trim().replace(/[^0-9.,\-]/g, '');
        if (!str) return "";
        var lastDot = str.lastIndexOf('.');
        var lastComma = str.lastIndexOf(',');
        if (lastDot !== -1 && lastComma !== -1) {
            if (lastDot > lastComma) { str = str.replace(/,/g, ''); }
            else { str = str.replace(/\./g, '').replace(',', '.'); }
        } else if (lastComma !== -1) {
            var parts = str.split(',');
            if (parts.length > 2) { str = str.replace(/,/g, ''); }
            else { if (parts[1].length === 3) { str = str.replace(/,/g, ''); } else { str = str.replace(',', '.'); } }
        } else if (lastDot !== -1) {
            var parts = str.split('.');
            if (parts.length > 2) { str = str.replace(/\./g, ''); }
            else { if (parts[1].length === 3) { str = str.replace(/\./g, ''); } }
        }
        var num = parseFloat(str);
        return isNaN(num) ? str : num;
    }

    async function fetchWithRetry(url, options, maxRetries = 3, initialDelay = 1500) {
        let delay = initialDelay;
        const statusDiv = document.getElementById('status');
        for (let attempt = 1; attempt <= maxRetries; attempt++) {
            try {
                const response = await fetch(url, options);
                const data = await response.json();
                if (data.error) {
                    if (data.error.code === 503 || data.error.code === 429 || (data.error.message && data.error.message.includes("demand"))) {
                        throw new Error(data.error.message);
                    }
                    throw new Error("API Error: " + data.error.message);
                }
                return data;
            } catch (error) {
                console.warn(`Thử lại ${attempt}/${maxRetries}: ${error.message}`);
                if (attempt === maxRetries) throw error;
                statusDiv.innerText = `⏳ Máy chủ bận, đang thử lại (${attempt}/${maxRetries})...`;
                statusDiv.style.color = "#fd7e14";
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2;
            }
        }
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    async function processAllInvoices() {
        const statusDiv = document.getElementById('status');
        const processBtn = document.getElementById('processBtn');
        processBtn.disabled = true;
        extractedResults = [];
        let errorMessages = [];

        const promptText = `Trích xuất thông tin hóa đơn này và trả về JSON duy nhất:
{
  "soHoaDon": "string",
  "ngayXuat": "string (dd/mm/yyyy)",
  "donViBan": "string",
  "maSoThue": "string",
  "soTienTruocVAT": "string (số thuần túy không có phân cách hàng ngàn, ví dụ: 867300 hoặc 867300.5)",
  "thueVAT": "string (số thuần túy không có phân cách hàng ngàn, ví dụ: 73964 hoặc 73964.5)",
  "tongSoTien": "string (số thuần túy không có phân cách hàng ngàn, ví dụ: 941264 hoặc 941264.5)"
}`;

        const apiUrl = `https://gemini-invoice-proxy.trieudong-5277.workers.dev/`;

        for (let i = 0; i < selectedFiles.length; i++) {
            const file = selectedFiles[i];
            statusDiv.innerText = `⏳ Đang đọc file (${i + 1}/${selectedFiles.length}): ${file.name}...`;
            statusDiv.style.color = "#0d6efd";
            try {
                const base64Data = await fileToBase64(file);
                let mimeType = file.type;
                if (!mimeType && file.name.toLowerCase().endsWith('.pdf')) mimeType = 'application/pdf';
                const requestBody = {
                    "contents": [{
                        "parts": [
                            { "text": promptText },
                            { "inline_data": { "mime_type": mimeType || "image/png", "data": base64Data } }
                        ]
                    }]
                };
                const data = await fetchWithRetry(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let textResponse = data.candidates[0].content.parts[0].text;
                    const jsonMatch = textResponse.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        const jsonRes = JSON.parse(jsonMatch[0]);
                        jsonRes.soTienTruocVAT = parsePureNumber(jsonRes.soTienTruocVAT);
                        jsonRes.thueVAT = parsePureNumber(jsonRes.thueVAT);
                        jsonRes.tongSoTien = parsePureNumber(jsonRes.tongSoTien);
                        extractedResults.push(jsonRes);
                    } else { throw new Error("Không tìm thấy cấu trúc JSON trong phản hồi."); }
                } else { throw new Error("Không nhận được nội dung từ AI."); }
            } catch (err) {
                console.error(`Lỗi file ${file.name}:`, err);
                errorMessages.push(`${file.name}: ${err.message}`);
            }
        }

        if (extractedResults.length > 0) {
            showPreviewList(extractedResults);
            statusDiv.innerText = `✓ Hoàn tất! Đã đọc thành công ${extractedResults.length}/${selectedFiles.length} hóa đơn.`;
            statusDiv.style.color = "#198754";
        } else {
            statusDiv.innerText = "Không thể đọc được hóa đơn. Lỗi: " + (errorMessages.join(" | ") || "Lỗi không xác định");
            statusDiv.style.color = "#dc3545";
        }
        processBtn.disabled = false;
    }

    function showPreviewList(list) {
        const tbody = document.getElementById('previewBody');
        tbody.innerHTML = list.map((data, index) => `
            <tr>
                <td style="text-align: center; font-weight: bold;">${index + 1}</td>
                <td>${data.soHoaDon || ''}</td>
                <td>${data.ngayXuat || ''}</td>
                <td>${data.donViBan || ''}</td>
                <td>${data.maSoThue || ''}</td>
                <td>${data.soTienTruocVAT ?? ''}</td>
                <td>${data.thueVAT ?? ''}</td>
                <td>${data.tongSoTien ?? ''}</td>
            </tr>
        `).join('');
        document.getElementById('resultCard').style.display = 'block';
    }

    // ====== PHẦN CHÈN DỮ LIỆU VÀO EXCEL ======
    async function insertAllToSheet() {
        if (!extractedResults || extractedResults.length === 0) return;

        try {
            await Excel.run(async (context) => {
                const sheet = context.workbook.worksheets.getActiveWorksheet();
                
                const tables = sheet.tables;
                tables.load("items/name");
                await context.sync();

                if (tables.items.length === 0) {
                    throw new Error("Không tìm thấy Table. Vui lòng bôi đen vùng dữ liệu và nhấn Ctrl+T để tạo Table trước.");
                }

                const table = tables.items[0];
                const dataBodyRange = table.getDataBodyRange();
                dataBodyRange.load("values");
                await context.sync();

                let maxStt = 0;
                if (dataBodyRange.values && dataBodyRange.values.length > 0) {
                    dataBodyRange.values.forEach(row => {
                        const val = parseInt(row[0], 10);
                        if (!isNaN(val) && val > maxStt) {
                            maxStt = val;
                        }
                    });
                }

                table.load("rows/count");
                await context.sync();
                let insertIndex = table.rows.count - 1; 
                
                if (insertIndex < 1) insertIndex = 1;

                for (let i = 0; i < extractedResults.length; i++) {
                    const d = extractedResults[i];
                    const stt = maxStt + 1 + i;

                    const rowData = [
                        String(stt), "", "", "",
                        String(d.soHoaDon || ""),
                        String(d.ngayXuat || ""),
                        String(d.donViBan || ""),
                        String(d.maSoThue || ""),
                        "",
                        String(d.soTienTruocVAT ?? ""),
                        String(d.thueVAT ?? ""),
                        String(d.tongSoTien ?? ""),
                        ""
                    ];

                    table.rows.add(insertIndex + i, [rowData]);
                    await context.sync(); 
                }
            });

            const statusDiv = document.getElementById('status');
            statusDiv.innerText = `✓ Đã chèn ${extractedResults.length} hóa đơn vào bảng tính!`;
            statusDiv.style.color = "#198754";
        } catch (error) {
            console.error("Lỗi khi chèn vào Excel:", error);
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Lỗi khi chèn vào Excel: " + error.message;
            statusDiv.style.color = "#dc3545";
        }
    }
</script>
</body>
</html>
